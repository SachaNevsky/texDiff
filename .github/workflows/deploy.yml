name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Cache the vendor directory
      - name: Cache vendor files
        uses: actions/cache@v4
        with:
          path: vendor/swiftlatex/texmf-dist
          key: texmf-dist-${{ hashFiles('vendor/swiftlatex/texmf-dist/ls-R') }}
          restore-keys: |
            texmf-dist-
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4